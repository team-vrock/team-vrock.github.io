<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% assign page_title = page.title | default: site.title %}
  {% assign page_description = page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 %}

  <title>{{ page_title }}</title>
  <meta name="description" content="{{ page_description }}">
  <meta name="theme-color" content="#1a222c">
  <meta property="og:title" content="{{ page_title }}">
  <meta property="og:description" content="{{ page_description }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  {% if site.url %}<meta property="og:url" content="{{ page.url | absolute_url }}">{% endif %}
  {% if page.image %}<meta property="og:image" content="{{ page.image | absolute_url }}">{% endif %}

  <script>
    (() => {
      const theme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', theme || (prefersDark ? 'dark' : 'light'));
    })();
  </script>
  <link rel="stylesheet" href="{{ "/assets/fontawesome/css/all.min.css" | prepend: site.baseurl }}">
  <link rel="stylesheet" href="{{ "/assets/main.css" | prepend: site.baseurl }}">
  <link rel="stylesheet" href="{{ "/assets/css/post-card-fix.css" | prepend: site.baseurl }}">
  <script src="{{ "/assets/js/navigation-fix.js" | prepend: site.baseurl }}" defer></script>
  <script src="{{ "/assets/js/site-search.js" | prepend: site.baseurl }}" defer></script>
</head>
